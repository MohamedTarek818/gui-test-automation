# Application
base.url=https://the-internet.herokuapp.com/

# Browser: chrome | firefox | edge  (override with -Dbrowser=firefox)
browser=chrome
# Run without UI (override with -Dheadless=true)
headless=false

# Synchronization
explicit.wait.seconds=15

# Test data location (relative to the classpath)
test.data.dir=testdata/
